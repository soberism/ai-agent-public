name: ${COMPOSE_PROJECT_NAME:-ai-agent}
services:
  db:
    restart: unless-stopped
    mem_limit: 512m
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先配置 .env 中的数据库密码}
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 192m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 Redis 密码}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction --save "" --appendonly no']
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 6
  rabbitmq:
    image: rabbitmq:4.3.5-alpine
    hostname: ai-agent-rabbitmq
    restart: unless-stopped
    mem_limit: 640m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ai_agent}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请配置 RabbitMQ 密码}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-ai_agent_dev}
    ports:
      - "127.0.0.1:15673:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  api:
    profiles: ["app"]
    build: .
    environment:
      APP_ENV: ${APP_ENV:-production}
      EMAIL_SCHEDULER_ENABLED: ${EMAIL_SCHEDULER_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-[]}
      CURSOR_SECRET: ${CURSOR_SECRET:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 Redis 密码}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请配置 RabbitMQ 密码}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先配置 .env 中的数据库密码}
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=10)"]
      interval: 10s
      timeout: 12s
      retries: 3
volumes:
  postgres_data:
  rabbitmq_data:
